agent_name = "dial-voice-agent"
region = "us-west"
agent_profile = "agent-1x"
# Clients must fetch a single-use token from /start before connecting —
# the mode Dial's Pipecat Cloud target is built for. Leave it on.
websocket_auth = "token"
# The secret set holding DEEPGRAM_API_KEY, OPENAI_API_KEY, and CARTESIA_API_KEY
# (see the README). Pipecat Cloud injects its keys as environment variables.
secret_set = "dial-voice-agent-secrets"

[scaling]
    # Keep at least one agent warm. With 0, the first call after an idle spell
    # waits on a cold start: Pipecat accepts the socket but no bot answers yet,
    # and the caller hears several seconds of silence after pickup.
    min_agents = 1
