[project]
name = "dial-self-hosted-pipecat-python"
version = "0.1.0"
description = "Run a Pipecat voice agent on a Dial phone call: the Dial Self-Hosted audio protocol as a Pipecat FrameSerializer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[cartesia,deepgram,openai,silero,websocket]>=1.10.0",
    "dial-sdk>=0.26.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["server", "bot", "dial_serializer"]
